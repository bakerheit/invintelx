# Blank issues are off so that every bug arrives saying which deployment it is
# about. The two links below are the routes for the things that are not bugs.
blank_issues_enabled: false

contact_links:
  - name: Running your own instance
    url: https://github.com/bakerheit/invintelx#running-it-outside-a-dev-checkout
    about:
      Self-hosting is permitted and documented but not supported — invintelx.org is the
      only deployment this project runs. Questions about your own Kubernetes, Docker,
      proxy or TLS setup are not bugs in InvIntelX and may go unanswered. If InvIntelX
      itself misbehaves and you can reproduce it in a dev checkout, that is a bug — open
      one.

  - name: Security vulnerability
    url: https://github.com/bakerheit/invintelx/security/advisories/new
    about:
      Please do not open a public issue for a security problem. Report it privately
      here instead.
