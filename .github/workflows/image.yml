name: Image

# CI proves the workspace builds. This proves the *image* builds and that the
# compose stack it ships with actually produces a running InvIntelX — which is
# a different claim, and the one a self-hoster is relying on.
#
# Deliberately not part of ci.yml: the release workflow calls CI to verify a
# tag and then builds the image itself, so folding this in would build it twice
# on every release.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build the image and boot the stack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # `load: true` so the local daemon has it and compose can run it. Not
      # pushed: publishing is the release workflow's job and nobody else's.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: invintelx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Written rather than copied from .env.example, so a placeholder in the
      # example cannot quietly become the thing under test.
      - name: Configure the stack
        working-directory: deploy
        run: |
          {
            echo "INVINTELX_IMAGE=invintelx:ci"
            echo "SESSION_SECRET=$(openssl rand -base64 32)"
            echo "WEB_ORIGIN=http://localhost:3001"
            echo "MONGODB_DB=invintelx"
            echo "FIRST_ADMIN_SETUP=token"
          } > .env

      # --wait blocks on the image's own HEALTHCHECK, so reaching the next step
      # already means /api/health answered. The assertions below are about what
      # it answered, and about the web app being there at all.
      - name: Boot it
        working-directory: deploy
        run: docker compose up -d --wait --wait-timeout 240

      - name: The API is healthy and can reach its database
        run: |
          body=$(curl -fsS http://127.0.0.1:3001/api/health)
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
          echo "$body" | grep -q '"database":true'

      # The whole point of the image is one process serving both. An API-only
      # container passes every check above and is still a broken release.
      - name: The web app is served from the same origin
        run: |
          curl -fsS http://127.0.0.1:3001/ | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:3001/items | grep -q 'id="root"'

      # The version at /api/health is what a bug report quotes. "unknown" means
      # the image lost apps/api/package.json and nobody would notice until then.
      - name: It knows which version it is
        run: |
          body=$(curl -fsS http://127.0.0.1:3001/api/health)
          case "$body" in
            *'"version":"unknown"'*)
              echo "::error title=Version is unknown::$body"
              exit 1
              ;;
          esac

      - name: Nothing in the final image but the runtime
        run: |
          docker run --rm --entrypoint sh invintelx:ci -c '
            set -e
            for leftover in /app/node_modules/typescript /app/node_modules/vite /app/apps/api/node_modules/tsx /pnpm; do
              if [ -e "$leftover" ]; then echo "dev toolchain shipped: $leftover"; exit 1; fi
            done
            [ "$(id -un)" = node ] || { echo "not running as node: $(id -un)"; exit 1; }
          '

      - name: Logs, if any of that failed
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color

      - name: Tear it down
        if: always()
        working-directory: deploy
        run: docker compose down -v
